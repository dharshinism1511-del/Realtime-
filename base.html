<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}TaxiPulse{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-1: #050814;
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --purple: #a855f7;
  --pink: #ec4899;
  --amber: #f59e0b;
  --emerald: #10b981;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --glass: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --sidebar-w: 240px;
}

html { scroll-behavior: smooth; }

body {
  font-family: "Outfit", sans-serif;
  background: var(--bg-1);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background orbs */
body::before, body::after {
  content: "";
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.3;
  z-index: -1;
  animation: float 18s ease-in-out infinite;
  pointer-events: none;
}
body::before {
  background: radial-gradient(circle, #22d3ee, transparent 70%);
  top: -200px; left: -150px;
}
body::after {
  background: radial-gradient(circle, #a855f7, transparent 70%);
  bottom: -200px; right: -150px;
  animation-delay: -9s;
}
@keyframes float {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(40px,-40px) scale(1.1); }
}

/* ============ SIDEBAR ============ */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: rgba(5, 8, 20, 0.7);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  z-index: 100;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.sidebar-logo-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 8px 24px rgba(34, 211, 238, 0.35);
  animation: pulse 2.5s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%,100% { transform: scale(1); box-shadow: 0 8px 24px rgba(34,211,238,0.35); }
  50% { transform: scale(1.05); box-shadow: 0 8px 32px rgba(34,211,238,0.55); }
}
.sidebar-logo-text h1 {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(90deg, #22d3ee, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sidebar-logo-text p {
  font-size: 10px; color: var(--muted);
  letter-spacing: 1.5px; text-transform: uppercase;
}

.nav-label {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.5px;
  padding: 0 12px 10px; font-weight: 700;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.25s ease;
  position: relative;
}
.nav a .icon {
  font-size: 18px;
  width: 22px;
  text-align: center;
}
.nav a:hover {
  background: rgba(34, 211, 238, 0.08);
  color: var(--cyan);
}
.nav a.active {
  background: linear-gradient(90deg, rgba(34,211,238,0.2), rgba(168,85,247,0.12));
  color: #f8fafc;
  border: 1px solid rgba(34,211,238,0.3);
}
.nav a.active::before {
  content: "";
  position: absolute;
  left: -16px; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 22px;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(180deg, var(--cyan), var(--purple));
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px;
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
}
.live-dot {
  width: 8px; height: 8px;
  border-radius: 50%; background: #34d399;
  box-shadow: 0 0 10px #34d399;
  animation: blink 1.5s infinite;
  flex-shrink: 0;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.sidebar-footer span {
  font-size: 11px; color: #34d399; font-weight: 600;
  letter-spacing: 0.5px;
}

/* ============ MAIN ============ */
.main-wrapper {
  margin-left: var(--sidebar-w);
  padding: 28px 40px 60px;
  max-width: 1500px;
  animation: pageIn 0.5s ease;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
}
.page-head h1 {
  font-size: 28px;
  font-weight: 700;
  color: #f8fafc;
  letter-spacing: -0.5px;
}
.page-head p {
  color: var(--muted);
  font-size: 14px;
  margin-top: 4px;
}
.page-head .badge {
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(34, 211, 238, 0.1);
  border: 1px solid rgba(34, 211, 238, 0.3);
  color: var(--cyan);
  font-size: 12px;
  font-weight: 600;
  font-family: monospace;
}

/* ============ SHARED COMPONENTS ============ */
.section-title {
  font-size: 13px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 2px;
  margin: 32px 0 14px; font-weight: 600;
}

.panel {
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 24px;
}
.panel h3 {
  font-size: 16px; font-weight: 600; color: #f8fafc;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.panel h3::before {
  content: ""; width: 4px; height: 18px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--cyan), var(--purple));
}

/* Responsive */
@media (max-width: 900px) {
  .sidebar {
    width: 70px;
    padding: 20px 8px;
  }
  .sidebar-logo-text,
  .nav-label,
  .nav a span:not(.icon),
  .sidebar-footer span { display: none; }
  .sidebar-logo { justify-content: center; padding-bottom: 16px; }
  .nav a { justify-content: center; padding: 14px; }
  .main-wrapper { margin-left: 70px; padding: 20px; }
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<!-- ============ SIDEBAR ============ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">🚖</div>
    <div class="sidebar-logo-text">
      <h1>TaxiPulse</h1>
      <p>Analytics</p>
    </div>
  </div>

  <p class="nav-label">Menu</p>
  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'dashboard' }}">
      <span class="icon">📊</span><span>Dashboard</span>
    </a>
    <a href="/analytics" class="{{ 'active' if active == 'analytics' }}">
      <span class="icon">📈</span><span>Analytics</span>
    </a>
    <a href="/live" class="{{ 'active' if active == 'live' }}">
      <span class="icon">⚡</span><span>Live Map</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="live-dot"></div>
    <span>LIVE DATA</span>
  </div>
</aside>

<!-- ============ MAIN ============ -->
<div class="main-wrapper">
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
